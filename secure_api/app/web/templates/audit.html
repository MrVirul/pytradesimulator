<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Audit</title>
  <meta name="htmx-config" content='{"historyEnabled": false, "historyCacheSize": 0}'>
  <link rel="stylesheet" href="/static/market.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Audit</h1>
    <nav>
      <a href="/ui/market">Market</a>
      <a href="/ui/alerts">Alerts</a>
      <a href="/ui">Account</a>
    </nav>
  </header>
  <form id="audit-filters" class="symbol-form" method="get" action="/ui/audit"
        hx-get="/ui/audit/rows" hx-trigger="change, submit"
        hx-target="#audit-rows" hx-swap="outerHTML">
    <label for="request_id">Request id</label>
    <input id="request_id" name="request_id" value="{{ request_id }}" maxlength="80">
    <label for="filter-client">Client</label>
    <input id="filter-client" name="client_id" value="{{ client_id }}" maxlength="80">
    <label for="action">Action</label>
    <input id="action" name="action" value="{{ action }}" maxlength="64">
    <label for="decision">Decision</label>
    <select id="decision" name="decision">
      <option value=""></option>
      <option value="allowed"{% if decision == "allowed" %} selected{% endif %}>allowed</option>
      <option value="denied"{% if decision == "denied" %} selected{% endif %}>denied</option>
    </select>
    <label for="status_code">Status</label>
    <input id="status_code" name="status_code" value="{{ status_code }}" maxlength="3">
    <label for="recorded_from">From</label>
    <input id="recorded_from" name="recorded_from" value="{{ recorded_from }}">
    <label for="recorded_to">To</label>
    <input id="recorded_to" name="recorded_to" value="{{ recorded_to }}">
    <button type="submit">Filter</button>
  </form>
  {% include "audit_rows.html" %}
</body>
</html>

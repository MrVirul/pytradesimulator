{% extends "base.html" %}
{% block title %}Surveillance{% endblock %}
{% block content %}
<h1>Surveillance</h1>
<form id="alert-filters" class="symbol-form" method="get" action="/ui/alerts"
      hx-get="/ui/alerts/rows" hx-trigger="change, submit"
      hx-target="#alert-rows" hx-swap="outerHTML">
  <label for="symbol">Symbol</label>
  <input id="symbol" name="symbol" value="{{ symbol }}" maxlength="16">
  <label for="rule">Rule</label>
  <input id="rule" name="rule_name" value="{{ rule_name }}" maxlength="64">
  <label for="severity">Severity</label>
  <input id="severity" name="severity" value="{{ severity }}" maxlength="16">
  <button type="submit">Filter</button>
</form>
{% include "alert_rows.html" %}
{% endblock %}

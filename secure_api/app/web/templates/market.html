{% extends "base.html" %}
{% block title %}{{ symbol }}{% endblock %}
{% block content %}
<h1>{{ symbol }}</h1>
<form class="symbol-form" method="get" action="/ui/market">
  <label for="symbol">Symbol</label>
  <select id="symbol" name="symbol">
    {% for name in symbol_choices %}
    <option value="{{ name }}" {% if name == symbol %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Show</button>
</form>
{% include "book.html" %}
{% endblock %}

<section id="scenario-run"
  {% if run.status == "pending" or run.status == "running" %}
  hx-get="/ui/scenarios/runs/{{ run.id }}"
  hx-trigger="every 3s [document.visibilityState === 'visible']"
  hx-swap="outerHTML"
  {% endif %}>
  <p>Run {{ run.id }} {{ run.scenario }} is {{ run.status }}.</p>
  {% if run.status == "passed" and run.symbol %}
  <p><a href="/ui/alerts?symbol={{ run.symbol }}">Alerts for {{ run.symbol }}</a></p>
  {% endif %}
  {% if run.request_id %}
  <p>Request <a href="/ui/audit?request_id={{ run.request_id }}">{{ run.request_id }}</a></p>
  {% endif %}
  {% if run.status == "failed" %}
  <p>The scenario did not complete.</p>
  {% endif %}
</section>

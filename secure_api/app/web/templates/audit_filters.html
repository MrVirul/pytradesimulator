<form id="audit-filters" class="filter-bar" method="get" action="/ui/audit"
      hx-get="/ui/audit/rows" hx-trigger="change, submit"
      hx-target="#audit-rows" hx-swap="outerHTML">
  <label for="request_id">Request id</label>
  <input id="request_id" name="request_id" type="search" value="{{ request_id }}" maxlength="80" data-primary aria-keyshortcuts="/">
  <label for="filter-client">Client</label>
  <input id="filter-client" name="client_id" value="{{ filter_client }}" maxlength="80">
  <label for="action">Action</label>
  <input id="action" name="action" value="{{ action }}" maxlength="64">
  <label for="decision">Decision</label>
  <select id="decision" name="decision">
    <option value=""></option>
    <option value="allowed"{% if decision == "allowed" %} selected{% endif %}>allowed</option>
    <option value="denied"{% if decision == "denied" %} selected{% endif %}>denied</option>
  </select>
  <label for="status_code">Status</label>
  <select id="status_code" name="status_code">
    <option value=""></option>
    {% for code in ["401", "403", "429"] %}
    <option value="{{ code }}" {% if status_code == code %}selected{% endif %}>{{ code }}</option>
    {% endfor %}
  </select>
  <label for="recorded_from">From</label>
  <input id="recorded_from" name="recorded_from" type="datetime-local" value="{{ recorded_from }}">
  <label for="recorded_to">To</label>
  <input id="recorded_to" name="recorded_to" type="datetime-local" value="{{ recorded_to }}">
  <button type="submit">Filter</button>
</form>

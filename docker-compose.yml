services:
  # Runs both FIX gateways. They hand order books to each other over a
  # localhost channel, so they have to share a container.
  exchange:
    build:
      context: .
      dockerfile: DockerFile
    image: pytradesim:latest
    container_name: pytradesim-exchange
    command: ["server"]
    # FIX stays on the Compose network. Publishing 5001 or 5002 would
    # expose the unauthenticated legacy sessions on the host.
    expose:
      - "5001"  # FIX order entry
      - "5002"  # FIX market data
    environment:
      PYTRADESIM_INTERNAL_PORT: "9000"
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Interactive trading client:
  #   docker compose --profile client run --rm client
  client:
    build:
      context: .
      dockerfile: DockerFile
    image: pytradesim:latest
    command: ["client", "configs/client1.cfg"]
    environment:
      EXCHANGE_HOST: exchange
    depends_on:
      exchange:
        condition: service_healthy
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
    profiles: ["client"]

  # Interactive market data client:
  #   docker compose --profile market-client run --rm market-client
  market-client:
    build:
      context: .
      dockerfile: DockerFile
    image: pytradesim:latest
    command: ["market-client", "configs/mdclient1.cfg"]
    environment:
      EXCHANGE_HOST: exchange
    depends_on:
      exchange:
        condition: service_healthy
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
    profiles: ["market-client"]

  # Scripted order match. The legacy image must be rebuilt after the
  # CLIENT3 and MDCLIENT3 session blocks change, because those files are
  # copied into the image.
  #   docker compose build exchange
  #   docker compose --profile baseline run --rm fix-baseline
  fix-baseline:
    build:
      context: .
      dockerfile: DockerFile
    image: pytradesim:latest
    command: ["python", "/app/secure_api/tools/fix_baseline.py"]
    environment:
      EXCHANGE_HOST: exchange
      BASELINE_SYMBOL: BASELINE
    volumes:
      - ./secure_api:/app/secure_api:ro
    depends_on:
      exchange:
        condition: service_healthy
    profiles: ["baseline"]

  # Read model. Not published on the host. Demo password, documented in DOCKER.md.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pytradesim
      POSTGRES_PASSWORD: pytradesim
      POSTGRES_DB: pytradesim
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pytradesim -d pytradesim"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: pytradesim
      PGHOST: postgres
      PGUSER: pytradesim
      PGDATABASE: pytradesim
    volumes:
      - ./secure_api/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        for file in /migrations/*.sql; do
          psql -v ON_ERROR_STOP=1 -f "$$file"
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Own process. A web worker must not open this FIX session.
  subscriber:
    build:
      context: .
      dockerfile: secure_api/Dockerfile.subscriber
    image: pytradesim-subscriber:latest
    command: ["python", "/app/secure_api/adapter/subscriber.py"]
    environment:
      EXCHANGE_HOST: exchange
      SUBSCRIBE_SYMBOLS: MSFT,HYG,BASELINE
      PYTHONPATH: /app
      DATABASE_URL: postgresql://pytradesim_app:pytradesim@postgres:5432/pytradesim
    volumes:
      - ./secure_api:/app/secure_api:ro
    depends_on:
      exchange:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Places one resting bid. Does not open the market-data session.
  #   docker compose --profile order run --rm place-order
  place-order:
    image: pytradesim:latest
    command: ["python", "/app/secure_api/harness/send_resting_bid.py"]
    environment:
      EXCHANGE_HOST: exchange
      PYTHONPATH: /app
      ORDER_SYMBOL: BASELINE
      ORDER_PRICE: "51"
      ORDER_QTY: "40"
    volumes:
      - ./secure_api:/app/secure_api:ro
    depends_on:
      exchange:
        condition: service_healthy
    profiles: ["order"]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8081"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./secure_api/keycloak:/opt/keycloak/data/import:ro

  api:
    build:
      context: ./secure_api
      dockerfile: Dockerfile
    image: pytradesim-api:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://pytradesim_app:pytradesim@postgres:5432/pytradesim
      RATE_LIMIT_REQUIRED: "1"
      KEYCLOAK_PUBLIC_URL: http://localhost:8081
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: pytradesim
      KEYCLOAK_CLIENT_ID: pytradesim-ui
      KEYCLOAK_REDIRECT_URI: http://localhost:8080/ui/callback
      JWT_ISSUER: http://localhost:8081/realms/pytradesim
      JWT_AUDIENCE: pytradesim-api
      JWT_JWKS_URL: http://keycloak:8080/realms/pytradesim/protocol/openid-connect/certs
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
